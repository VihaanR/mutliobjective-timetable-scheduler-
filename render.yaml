services:
  - type: web
    name: djsce-timetable-scheduler
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn webapp.server:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.0
      - key: TIMETABLE_DEV_MODE
        value: "1"
      - key: MALLOC_ARENA_MAX
        value: "2"
      - key: CP_SAT_WORKERS
        value: "2"
