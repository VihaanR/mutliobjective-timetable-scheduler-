<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>My Timetable — DJ Sanghvi Timetable Platform</title>
<link rel="stylesheet" href="/static/style.css">
</head>
<body>
<header class="topbar">
  <div class="brand">
    <div class="logo">TT</div>
    <div>
      <h1>DJ Sanghvi Timetable Platform</h1>
      <p class="sub" id="whoami">Teacher view</p>
    </div>
  </div>
</header>
<nav class="navbar">
  <a href="/dashboard">Dashboard</a>
  <a href="/platform">Platform</a>
  <a href="/my-timetable" class="active">My Timetable</a>
  <a href="/guideline">NEP Guideline</a>
  <div class="nav-user">
    <span id="navName"></span>
    <button type="button" id="logoutBtn">Log out</button>
  </div>
</nav>

<main>
  <div class="panel-section">
    <h2>My teaching timetable</h2>
    <p class="status-line" id="status">Loading…</p>
    <p class="notes" id="multiYearHint" style="display:none;">Showing lectures merged across every
      year/division you teach, from the latest "Generate All Years Timetable" run.</p>
    <div id="gridArea"></div>
  </div>
  <div class="legend">
    <div class="legend-item"><span class="chip theory"></span> Theory</div>
    <div class="legend-item"><span class="chip lab"></span> Practical (lab)</div>
    <div class="legend-item"><span class="chip tut"></span> Tutorial</div>
    <div class="legend-item"><span class="chip brk"></span> Break</div>
  </div>
</main>

<script>
const $ = (id) => document.getElementById(id);
const TYPE_CLASS = { Theory: "theory", Practical: "lab", Tutorial: "tutorial", Break: "break" };

function buildGridTable(data) {
  const table = document.createElement("table");
  table.className = "tt";
  const thead = document.createElement("thead");
  let hrow = "<tr><th class='time-col'>Time</th>";
  data.days.forEach((d) => (hrow += `<th>${d}</th>`));
  hrow += "</tr>";
  thead.innerHTML = hrow;
  table.appendChild(thead);

  const tbody = document.createElement("tbody");
  data.periods.forEach((p) => {
    const tr = document.createElement("tr");
    tr.innerHTML = `<td class="time-col">${p.start}<br>${p.end}</td>`;
    data.days.forEach((_, dayIdx) => {
      const entries = data.cells[`${dayIdx}_${p.period}`] || [];
      const td = document.createElement("td");
      if (entries.length === 0) {
        td.innerHTML = `<div class="cell empty"></div>`;
      } else {
        const cell = document.createElement("div");
        cell.className = "cell";
        entries.forEach((e) => {
          const s = document.createElement("div");
          s.className = "session " + (TYPE_CLASS[e.type] || "theory");
          if (e.is_break) {
            s.innerHTML = `<div class="s-course">BREAK</div>`;
          } else {
            const batch = e.batch ? ` &middot; ${e.batch}` : "";
            // `class_label` ("SY Sem IV &middot; D1") is stamped per-entry by webapp/grid_meta.py
            // whenever branch identity is known; a run predating that (or a division with no
            // matching branch row) falls back to the bare division id, same as before this field
            // existed.
            const cls = e.class_label && e.class_label !== "—"
              ? e.class_label
              : (e.division_id || "");
            const division = cls ? `${cls} &middot; ` : "";
            s.innerHTML =
              `<div class="s-course">${e.course_code || e.course}${e.type === "Practical" ? " (Lab)" : ""}</div>` +
              `<div class="s-meta">${division}${e.room_name ? "@" + e.room_name : ""}${batch}</div>`;
          }
          cell.appendChild(s);
        });
        td.appendChild(cell);
      }
      tr.appendChild(td);
    });
    tbody.appendChild(tr);
  });
  table.appendChild(tbody);
  return table;
}

async function loadMe() {
  const res = await fetch("/api/auth/me");
  if (!res.ok) {
    window.location.href = "/login";
    return null;
  }
  return res.json();
}

async function loadTimetable() {
  const res = await fetch("/api/faculty/me/timetable");
  const gridArea = $("gridArea");
  if (!res.ok) {
    const body = await res.json().catch(() => ({}));
    $("status").textContent = body.detail || "No timetable available yet — check back after a run is generated.";
    return;
  }
  const data = await res.json();
  // `classes` (e.g. ["SY Sem III · D1", "TY Sem V · D2"]) comes from the run's stamped branch
  // labels (webapp/routers/faculty.py); falls back to bare division ids for a run predating that.
  const classes = data.classes && data.classes.length
    ? data.classes
    : [...new Set(Object.values(data.cells).flat().map((e) => e.division_id).filter(Boolean))].sort();
  const classesText = classes.length ? `Classes: ${classes.join(", ")} — ` : "";
  $("status").textContent = `${classesText}from run #${data.run_id}`;
  if (data.classes && data.classes.length > 1) {
    $("multiYearHint").style.display = "";
  } else if (data.classes && data.classes.length === 1) {
    $("multiYearHint").style.display = "";
    $("multiYearHint").textContent =
      "This is from a single-class run — ask an admin to run \"Generate All Years Timetable\" " +
      "on the Platform page to see your lectures across every year you teach.";
  }
  gridArea.innerHTML = "";
  gridArea.appendChild(buildGridTable(data));
}

$("logoutBtn").addEventListener("click", async () => {
  await fetch("/api/auth/logout", { method: "POST" });
  window.location.href = "/login";
});

(async () => {
  const me = await loadMe();
  if (!me) return;
  $("navName").textContent = me.name;
  $("whoami").textContent = `Signed in as ${me.name} (teacher)`;
  await loadTimetable();
})();
</script>
</body>
</html>
